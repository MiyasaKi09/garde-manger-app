name: Release production

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: stub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e

  migrate-and-deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      PGSSLMODE: require
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VERCEL_ORG_ID: team_MVt6BMtIICl0edY7H0YFiCaC
      VERCEL_PROJECT_ID: prj_uAqd9Tniy2CDeN2bAWCPYlgVCET0
    steps:
      # Les secrets sont vérifiés AVANT toute action sur la production. Sans ce
      # garde-fou, un VERCEL_TOKEN absent ne se manifestait qu'après six minutes
      # de migrations, sous la forme d'un « You defined "--token", but it's
      # missing a value » de la CLI Vercel — un message qui ne nomme ni le
      # secret ni le dépôt. La base se retrouvait migrée, le front non déployé,
      # et le canary jamais exécuté.
      - name: Vérifier les secrets de release
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_POOLER_HOST: ${{ secrets.SUPABASE_POOLER_HOST }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          # Une release fait deux choses distinctes : migrer la base, puis
          # redéployer l'application. Exiger les quatre secrets d'un bloc liait
          # les deux, et un jeton de déploiement absent empêchait la migration
          # d'une base dont tous les accès étaient pourtant disponibles. La
          # production est restée quatre jours sur un corpus périmé pour cette
          # seule raison, sans que le lien de cause à effet soit lisible.
          #
          # Les secrets de base de données gardent donc leur contrôle en tête de
          # job — sans eux, rien ne peut se faire. VERCEL_TOKEN est vérifié plus
          # bas, juste avant l'étape qui s'en sert.
          manquants=""
          for secret in SUPABASE_DB_PASSWORD SUPABASE_POOLER_HOST SUPABASE_PROJECT_REF; do
            if [ -z "${!secret}" ]; then manquants="$manquants $secret"; fi
          done
          if [ -n "$manquants" ]; then
            echo "::error title=Secret de release manquant::Secrets base de données absents ou vides :$manquants"
            echo "Renseignez-les dans Settings → Secrets and variables → Actions du dépôt." >&2
            echo "Aucune migration n'a été appliquée : la production est inchangée." >&2
            exit 1
          fi
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning title=VERCEL_TOKEN absent::Les migrations vont s'appliquer, mais le déploiement échouera."
          fi
          echo "Secrets de base de données présents."
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances et psql
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Configurer la connexion Supabase de production
        env:
          RAW_HOST: ${{ secrets.SUPABASE_POOLER_HOST }}
          RAW_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          host="$RAW_HOST"
          host="${host#postgresql://}"
          host="${host#postgres://}"
          if [[ "$host" == *"@"* ]]; then
            host="${host#*@}"
          fi
          host="${host%%/*}"
          host="${host%%:*}"
          host="$(echo -n "$host" | tr -d '[:space:]')"
          ref="$(echo -n "$RAW_REF" | tr -d '[:space:]')"

          test -n "$host" || { echo "SUPABASE_POOLER_HOST est absent"; exit 1; }
          test -n "$ref" || { echo "SUPABASE_PROJECT_REF est absent"; exit 1; }
          test -n "$PGPASSWORD" || { echo "SUPABASE_DB_PASSWORD est absent"; exit 1; }

          select_connection() {
            local port="$1" user="$2" pg_options="$3"
            if [ -n "$pg_options" ]; then
              PGOPTIONS="$pg_options" psql \
                "host=$host port=$port dbname=postgres user=$user sslmode=require" \
                -Atc "select 1" >/dev/null 2>&1
            else
              psql "host=$host port=$port dbname=postgres user=$user sslmode=require" \
                -Atc "select 1" >/dev/null 2>&1
            fi
          }

          for candidate in \
            "6543|postgres.${ref}|" \
            "6543|postgres|project=${ref}" \
            "6544|postgres.${ref}|" \
            "6544|postgres|project=${ref}"
          do
            IFS='|' read -r port user pg_options <<< "$candidate"
            if select_connection "$port" "$user" "$pg_options"; then
              echo "DATABASE_URL=host=$host port=$port dbname=postgres user=$user sslmode=require" >> "$GITHUB_ENV"
              if [ -n "$pg_options" ]; then
                echo "PGOPTIONS=$pg_options" >> "$GITHUB_ENV"
              fi
              echo "Connexion Supabase validée sur le port $port"
              exit 0
            fi
          done

          echo "Aucune connexion Supabase de production n'a abouti"
          exit 1
      - name: Vérifier le manifeste de migrations
        run: |
          node scripts/db/build-manifest.mjs
          git diff --exit-code -- scripts/db/migration-manifest.json
      - name: Réconcilier le registre de migrations
        run: |
          bash scripts/db/reconcile-ledger.sh --dry-run
          bash scripts/db/reconcile-ledger.sh apply
      - name: Dry-run migrations production
        run: bash scripts/db/apply-migrations.sh status
      - name: Appliquer les migrations production
        run: bash scripts/db/apply-migrations.sh apply
      - name: Vérifier idempotence, contrat et invariants
        run: |
          output=$(bash scripts/db/apply-migrations.sh apply)
          echo "$output"
          echo "$output" | grep -E '^migrations : 0 appliquées'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/ci/42_planning_final_demands.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/db/verify-planning-production.sql
      # À ce point la base est à jour. Le déploiement peut échouer sans remettre
      # ce travail en cause : les migrations de ce dépôt sont rétrocompatibles
      # par construction — la CI le vérifie sur base vierge et sur prod simulée —
      # si bien qu'une base en avance sur le code déployé reste servable.
      - name: Vérifier le jeton de déploiement
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error title=VERCEL_TOKEN absent::Migrations appliquées, déploiement impossible."
            echo "La base de production est à jour ; l'application n'a PAS été redéployée." >&2
            echo "Renseignez VERCEL_TOKEN dans Settings → Secrets and variables → Actions," >&2
            echo "puis relancez ce workflow pour publier le code." >&2
            exit 1
          fi
      - name: Construire avec l’environnement Vercel de production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@56.4.1 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@56.4.1 build --prod --token="$VERCEL_TOKEN"
      - name: Déployer Vercel après validation du schéma
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url=$(npx --yes vercel@56.4.1 deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Déploiement : $deployment_url"
          curl --fail --location --retry 8 --retry-delay 5 "$deployment_url/"
      - name: Canary transactionnel Planning V5
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/canary/planning_v5_transaction_canary.sql
